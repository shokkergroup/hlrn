name: HLRN site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/official-ui.js
          node --check assets/analytics.js
          node --check service-worker.js
      - name: Validate official-data trust boundary
        run: node pipeline/validate_official_contract.mjs --public-release
      - name: Audit crawlable race, Central, and driver pages
        run: node pipeline/audit_static_pages.mjs
      - name: Confirm critical public files
        shell: bash
        run: |
          test -s index.html
          test -s sitemap.xml
          test -s assets/data-official.js
          test -s assets/og-hlrn-living-wiki.png
          test -s assets/templates/hlrn-results-template.csv
